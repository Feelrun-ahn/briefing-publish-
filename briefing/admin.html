<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Briefing 관리자</title>
<style>
:root{
  --bg:#080a14; --card:rgba(255,255,255,.055); --bd:rgba(255,255,255,.1);
  --tx:#e8ecf6; --tx2:rgba(232,236,246,.62); --tx3:rgba(232,236,246,.4);
  --acc:#6ee7d4; --accSoft:rgba(110,231,212,.14); --accBd:rgba(110,231,212,.32);
  --violet:#8b7cf6; --rose:#f2748c; --amber:#f2b544;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
  font-family:'Space Grotesk',"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;padding:24px;max-width:960px;margin:0 auto}
h1{font-size:22px;font-weight:500;margin-bottom:4px}
.sub{font-size:13px;color:var(--tx3);margin-bottom:24px}
input,button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;margin-bottom:16px}
label{display:block;font-size:11px;letter-spacing:.14em;color:var(--acc);margin-bottom:6px}
input[type=email],input[type=password]{width:100%;padding:11px 13px;border-radius:11px;
  border:1px solid var(--bd);background:rgba(255,255,255,.06);margin-bottom:12px}
.btn{padding:11px 20px;border-radius:11px;border:1px solid var(--bd);background:rgba(255,255,255,.06);font-size:14px}
.btn.primary{background:var(--accSoft);border-color:var(--accBd);color:var(--acc);font-weight:600}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:9px}
.msg{font-size:13px;color:var(--tx3);margin-top:10px;min-height:18px}
.msg.err{color:var(--rose)}
.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:7px 14px;border-radius:999px;border:1px solid var(--bd);background:transparent;font-size:12.5px;color:var(--tx3)}
.tab.on{background:var(--accSoft);border-color:var(--accBd);color:var(--acc);font-weight:600}
.count{margin-left:auto;font-size:12px;color:var(--tx3)}
.rep{border:1px solid var(--bd);border-radius:14px;padding:16px 18px;margin-bottom:10px;background:var(--card)}
.rep.done{opacity:.5}
.rhead{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.kind{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600}
.kind.bug{background:rgba(242,116,140,.15);color:var(--rose)}
.kind.idea{background:rgba(139,124,246,.16);color:#c3b9ff}
.kind.etc{background:rgba(242,181,68,.15);color:var(--amber)}
.when{font-size:11.5px;color:var(--tx3)}
.rhead .btn{margin-left:auto}
.rtext{font-size:14.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.from{margin-top:10px;font-size:12.5px;color:var(--acc)}
details{margin-top:10px}
summary{font-size:11.5px;color:var(--tx3);cursor:pointer}
pre{margin-top:8px;font-size:11px;color:var(--tx3);white-space:pre-wrap;word-break:break-all;
  background:rgba(0,0,0,.25);padding:10px;border-radius:9px;line-height:1.6}
.empty{padding:30px 0;text-align:center;color:var(--tx3);font-size:14px}
.hint{font-size:12px;color:var(--tx3);line-height:1.6;margin-top:10px}
</style>
</head>
<body>

<h1>Briefing 관리자</h1>
<p class="sub">앱에서 들어온 오류 제보와 기능 제안을 확인합니다.</p>

<div class="box" id="loginBox">
  <label>관리자 이메일</label>
  <input type="email" id="em" autocomplete="username" placeholder="you@example.com">
  <label>비밀번호</label>
  <input type="password" id="pw" autocomplete="current-password">
  <button class="btn primary" id="loginBtn">로그인</button>
  <div class="msg" id="loginMsg"></div>
  <p class="hint">Firebase 콘솔 → Authentication → 이메일/비밀번호를 켜고 관리자 계정을 하나 만들어 두세요.
    Firestore 규칙에서 그 이메일만 <code>reports</code>를 읽을 수 있게 제한합니다.</p>
</div>

<div id="app" hidden>
  <div class="bar">
    <button class="tab on" data-f="open">처리 전</button>
    <button class="tab" data-f="all">전체</button>
    <button class="tab" data-f="bug">오류</button>
    <button class="tab" data-f="idea">제안</button>
    <button class="btn sm" id="reload">새로고침</button>
    <span class="count" id="count"></span>
  </div>
  <div id="list"></div>
</div>

<script>
const CFG = { project:'morning-public', apiKey:'AIzaSyCJP05vT5vuWeNaoy-AQrYx8kLzkx0JjOE' };
let token = '', filter = 'open', rows = [];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fsUrl = p => `https://firestore.googleapis.com/v1/projects/${CFG.project}/databases/(default)/documents/${p}?key=${CFG.apiKey}`;

async function login(){
  const email = $('em').value.trim(), password = $('pw').value;
  if(!email || !password){ $('loginMsg').textContent = '이메일과 비밀번호를 넣어 주세요.'; return; }
  $('loginMsg').textContent = '로그인 중…'; $('loginMsg').className = 'msg';
  try{
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${CFG.apiKey}`,
      { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, password, returnSecureToken:true }) });
    if(!r.ok) throw new Error('이메일 또는 비밀번호가 맞지 않습니다');
    const j = await r.json();
    token = j.idToken;
    sessionStorage.setItem('bfAdmin', token);
    $('loginBox').hidden = true; $('app').hidden = false;
    load();
  }catch(e){ $('loginMsg').textContent = e.message; $('loginMsg').className = 'msg err'; }
}

function val(f, k, d){
  if(!f || !f[k]) return d;
  const v = f[k];
  return v.stringValue !== undefined ? v.stringValue
       : v.integerValue !== undefined ? +v.integerValue
       : v.booleanValue !== undefined ? v.booleanValue : d;
}

async function load(){
  $('list').innerHTML = '<div class="empty">불러오는 중…</div>';
  try{
    const r = await fetch(fsUrl('reports') + '&pageSize=300',
      { headers:{ 'Authorization':'Bearer ' + token } });
    if(!r.ok) throw new Error('읽을 권한이 없습니다. Firestore 규칙을 확인하세요.');
    const j = await r.json();
    rows = (j.documents || []).map(d => ({
      path: d.name.split('/documents/')[1],
      kind: val(d.fields,'kind','etc'),
      text: val(d.fields,'text',''),
      from: val(d.fields,'from',''),
      diag: val(d.fields,'diag',''),
      at:   val(d.fields,'at',0),
      done: val(d.fields,'done',false)
    })).sort((a,b) => b.at - a.at);
    render();
  }catch(e){ $('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function render(){
  const list = rows.filter(r =>
    filter === 'all' ? true :
    filter === 'open' ? !r.done :
    r.kind === filter);
  $('count').textContent = `${list.length}건 / 전체 ${rows.length}건`;
  const KIND = { bug:'오류', idea:'제안', etc:'문의' };
  $('list').innerHTML = list.length ? list.map(r => {
    const d = new Date(r.at);
    const when = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `<div class="rep ${r.done?'done':''}">
      <div class="rhead">
        <span class="kind ${r.kind}">${KIND[r.kind] || '문의'}</span>
        <span class="when">${when}</span>
        <button class="btn sm" data-done="${esc(r.path)}" data-v="${r.done?'0':'1'}">${r.done?'되돌리기':'처리 완료'}</button>
      </div>
      <div class="rtext">${esc(r.text)}</div>
      ${r.from ? `<div class="from">답장: ${esc(r.from)}</div>` : ''}
      ${r.diag ? `<details><summary>기기 정보</summary><pre>${esc(r.diag)}</pre></details>` : ''}
    </div>`;
  }).join('') : '<div class="empty">해당하는 제보가 없습니다.</div>';
}

$('list').addEventListener('click', async e => {
  const b = e.target.closest('[data-done]'); if(!b) return;
  const path = b.dataset.done, v = b.dataset.v === '1';
  b.disabled = true;
  try{
    await fetch(fsUrl(path) + '&updateMask.fieldPaths=done',
      { method:'PATCH', headers:{ 'Authorization':'Bearer ' + token, 'Content-Type':'application/json' },
        body: JSON.stringify({ fields:{ done:{ booleanValue:v } } }) });
    const row = rows.find(r => r.path === path); if(row) row.done = v;
    render();
  }catch(err){ b.disabled = false; }
});

document.querySelector('.bar').addEventListener('click', e => {
  const t = e.target.closest('[data-f]'); if(!t) return;
  filter = t.dataset.f;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  render();
});
$('reload').onclick = load;
$('loginBtn').onclick = login;
$('pw').addEventListener('keydown', e => { if(e.key === 'Enter') login(); });

const saved = sessionStorage.getItem('bfAdmin');
if(saved){ token = saved; $('loginBox').hidden = true; $('app').hidden = false; load(); }
</script>
</body>
</html>
